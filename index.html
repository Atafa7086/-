<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>奶蛙倖存者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: full-bleed pixel canvas, thin HUD strip on top, pixel-panel overlays for title / level-up / shop. Single dark "night pond" world by choice. */
:root{
  --ink:#120f1c; --panel:#1d1829; --panel2:#282038; --line:#43385a;
  --cream:#f3e6c4; --muted:#a99fbe; --frog:#f5c73a; --frog-d:#a8731a;
  --lily:#7cc76c; --blood:#e5484d; --sky:#8fd3ff;
  --pix:"DotGothic16","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--cream);overflow:hidden}
body{font-family:var(--pix);-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}

#hud{position:absolute;inset:0 0 auto 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;
  padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud-l{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;align-items:center;gap:6px}
.lab{font-size:12px;width:30px;color:var(--muted);text-shadow:1px 1px 0 #000}
.bar{position:relative;width:min(150px,36vw);height:14px;background:#0b0912cc;border:2px solid var(--line);box-shadow:0 2px 0 #0007}
.bar .fill{height:100%;width:100%;background:var(--blood);box-shadow:inset 0 -3px 0 #0003, inset 0 2px 0 #fff3}
.bar.xp{height:8px}.bar.xp .fill{background:var(--lily)}
.bt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;text-shadow:1px 1px 0 #000}
.coin{font-size:15px;text-shadow:1px 1px 0 #000;gap:6px}
.coin img{width:15px;height:12px}
.hud-c{text-align:center;text-shadow:2px 2px 0 #000}
#waveT{font-size:13px;color:var(--muted)}
#timeT{font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--cream)}
#timeT.hot{color:var(--blood)}
.hud-r{justify-self:end;display:flex;gap:6px}
.ib{pointer-events:auto;width:36px;height:36px;border:2px solid var(--line);background:#1d1829dd;color:var(--cream);font:inherit;font-size:15px;cursor:pointer;box-shadow:0 3px 0 #0008}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #0008}
.ib:focus-visible,.btn:focus-visible,.card:focus-visible{outline:2px solid var(--frog);outline-offset:2px}

#bossbar{position:absolute;left:50%;top:76px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;width:min(360px,72vw)}
#bossbar span{font-size:12px;color:#c9f0b8;text-shadow:1px 1px 0 #000;letter-spacing:.08em}
#bossbar .bar{width:100%;height:10px}
#bossbar .fill{background:#5fbf55}

#joy{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border:2px dashed #f3e6c466;border-radius:50%;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;background:#f5c73a99;border:2px solid #f3e6c4aa;border-radius:50%}

#screen{position:absolute;inset:0;display:flex;overflow-y:auto;background:rgba(13,10,22,.84);
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{margin:auto;width:min(780px,100%);display:flex;flex-direction:column;gap:16px}
.center{text-align:center;align-items:center}
h1{margin:0;font-weight:400;font-size:clamp(40px,10vw,68px);line-height:1;color:var(--frog);text-shadow:4px 4px 0 #6b3d10;letter-spacing:.04em;text-wrap:balance}
h2{margin:0;font-weight:400;font-size:clamp(22px,5vw,30px);color:var(--frog);text-shadow:3px 3px 0 #5a340e;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;line-height:1.6;margin:0}
.hero{height:112px;width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.card{background:var(--panel2);border:2px solid var(--line);box-shadow:0 4px 0 #0009;padding:12px;display:flex;flex-direction:column;gap:7px;
  cursor:pointer;text-align:left;color:inherit;font:inherit;min-width:0;transition:transform .08s}
.card:hover{border-color:var(--frog);transform:translateY(-2px)}
.card[disabled]{opacity:.45;cursor:default;transform:none;border-color:var(--line)}
.card .top{display:flex;align-items:center;gap:8px}
.card .ico{width:32px;height:32px;flex:none;display:grid;place-items:center;background:#0d0b15;border:2px solid var(--line);font-size:16px}
.card .ico img{width:24px;height:24px}
.card .nm{font-size:16px;line-height:1.2}
.card .ds{font-size:13px;color:var(--muted);line-height:1.5;flex:1}
.tag{display:inline-block;font-size:11px;padding:1px 6px;background:var(--line);color:var(--cream);width:fit-content}
.tag.w{background:#2f5a35;color:#c9f3bb}.tag.u{background:#6b4b12;color:#ffe3a0}
.price{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--frog)}
.price img{width:15px;height:12px}
.price.no{color:var(--blood)}
.btn{background:var(--frog);color:#2a1a08;border:0;box-shadow:0 4px 0 var(--frog-d);padding:11px 18px;font:inherit;font-size:16px;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--frog-d)}
.btn.ghost{background:var(--panel2);color:var(--cream);box-shadow:0 4px 0 #0009;border:2px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.bar-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.shop-wrap{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:14px;align-items:start}
.box{background:var(--panel);border:2px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.box h3{margin:0;font-weight:400;font-size:14px;color:var(--muted);letter-spacing:.08em}
.stats{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.stats span:nth-child(odd){color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.slot{aspect-ratio:1;max-width:100%;background:#0d0b15;border:2px solid var(--line);display:grid;place-items:center;position:relative}
.slot img{width:70%;height:70%}
.slot b{position:absolute;right:1px;bottom:-1px;font-weight:400;font-size:10px;color:var(--frog);text-shadow:1px 1px 0 #000}
.keys{font-size:13px;color:var(--muted);line-height:1.7}
.keys kbd{font-family:inherit;border:1px solid var(--line);background:var(--panel2);padding:0 5px;color:var(--cream)}
.big-n{font-size:30px;color:var(--cream)}
.result{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.result .box{align-items:center}
@media (max-width:640px){.shop-wrap{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:9px}.card .nm{font-size:14px}.card .ds{font-size:12px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div class="hud-l">
      <div class="row"><span class="lab">HP</span><div class="bar"><div id="hpF" class="fill"></div><span id="hpT" class="bt"></span></div></div>
      <div class="row"><span class="lab" id="lvT">Lv1</span><div class="bar xp"><div id="xpF" class="fill"></div></div></div>
      <div class="row coin"><img id="coinIco" class="pix" alt=""><span id="coinT">0</span></div>
    </div>
    <div class="hud-c"><div id="waveT">第 1 波 / 20</div><div id="timeT">20</div></div>
    <div class="hud-r"><button id="muteBtn" class="ib" aria-label="音效開關">♪</button><button id="pauseBtn" class="ib" aria-label="暫停">II</button></div>
  </div>
  <div id="bossbar" hidden><span>蛇王 · 青竹絲</span><div class="bar"><div id="bossF" class="fill"></div></div></div>
  <div id="joy" hidden><div id="knob"></div></div>
  <div id="screen"></div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const app=$('#app'),cv=$('#cv'),ctx=cv.getContext('2d'),scr=$('#screen');
const ARENA=640,M=96,WS=ARENA+M*2;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pickR=a=>a[Math.floor(Math.random()*a.length)];
let VW=320,VH=240,SCALE=3,camX=0,camY=0;

/* ---------- sprites ---------- */
const WH=new Map();
function mk(rows,pal){const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=rows[j][i];if(ch!=='.'&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,j,1,1)}}
  const d=document.createElement('canvas');d.width=w;d.height=h;const y=d.getContext('2d');y.drawImage(c,0,0);y.globalCompositeOperation='source-in';y.fillStyle='#fff';y.fillRect(0,0,w,h);WH.set(c,d);return c}
const PF={o:'#5a3a10',y:'#f2c230',Y:'#ffe27a',d:'#d39418',c:'#f3dca0',C:'#e2c27a',w:'#ffffff',g:'#6cc03a',G:'#a6e868',k:'#111111',h:'#6b5a2a',H:'#8c7838',f:'#6b5a2a'};
const FROG_TOP=["......oooo......","....ooyyyyoo....","...oyYyyyyyyo...","..oyYyyyoooyyo..","..oyyyyogGkoyo..","..oyyyyoggkoyo..","..oyyyyyoooyyo..","..oyyyyyyyyyooo.","..oyyyyyyyyyyo..",".oyyyyyyyyyyyo..",".oyyyyycccccyo..","oyyyyccccccccyo.","oyyyyccHhhccccyo","oydyycccHhhcccyo","oddyycccccccccyo","oddyyycccccCCyyo",".oddyyyyyyyyyyo.","..oddddddddddo.."];
const SPR={
  frog:[mk(FROG_TOP.concat(["...odo....odo...","..offfo..offffo.","..ooooo..oooooo."]),PF),mk(FROG_TOP.concat(["....odo..odo....","...offffo.offfo.","...oooooo.ooooo."]),PF)],
  mosq:[mk(["............",".ww......ww.","wwww....wwww",".wwwoooowww.","...obbbbo...","..obrbbrbo..","..obbbbbbo..","...obbbbo...","....onno....",".....nn.....",".....n......","............"],{o:'#241a30',b:'#7a5aa0',w:'#cde9ff',r:'#ff5a4a',n:'#241a30'}),
        mk(["............","............","............","wwwwoooowwww","...obbbbo...","..obrbbrbo..","..obbbbbbo..","...obbbbo...","....onno....",".....nn.....",".....n......","............"],{o:'#241a30',b:'#7a5aa0',w:'#cde9ff',r:'#ff5a4a',n:'#241a30'})],
};
const BEETLE=["...o......o...","....okkkko....","...okwkkwko...","..orRRrorRRro.",".orRRrrorRRrro","orrrrrrorrrrro","orrrrrrorrrrro","orrrrrrorrrrro",".orrrrrorrrro.","..orrrrorrro.."];
const PB={o:'#1a1622',k:'#2e2838',w:'#ffffff',r:'#b8433a',R:'#ea7a5e'};
const PE={o:'#140f1e',k:'#2e2838',w:'#ffe14a',r:'#5b3fa8',R:'#9a7bf0'};
SPR.beetle=[mk(BEETLE.concat([".o.oooooooo.o.","o............o"]),PB),mk(BEETLE.concat(["..ooooooooooo.",".o..........o."]),PB)];
SPR.elite=[mk(BEETLE.concat([".o.oooooooo.o.","o............o"]),PE),mk(BEETLE.concat(["..ooooooooooo.",".o..........o."]),PE)];
const SNAIL=["..........o.o.","..........k.k.","...oooo...o.o.","..oSSSSo..ogo.",".oSsssSSo.ogo.",".oSsSSsSo.ogo.",".oSsSsSSoogggo",".oSssSSSogggo.","..oSSSSoggggo.",".ogggggggggo..","oooooooooooo..",".............."];
const PS={o:'#1f1a24',s:'#7d4fc4',S:'#b58cf2',g:'#8fd17a',k:'#1f1a24'};
SPR.snail=[mk(SNAIL,PS),mk(SNAIL.map((r,i)=>i<9?r:r),PS)];
const RAT=["........oo.oo.",".......opoopo.","......ommmmmo.",".....ommmrmmo.","..oooMMmmmmmpo",".oMMMMmmmmmmo.","oMMMMMmmmmmo..","omMMMmmmmmo...",".ommmmmmmmo..."];
const PR={o:'#221e28',m:'#857f92',M:'#b4aec2',p:'#f29bb0',r:'#ff4a4a'};
SPR.rat=[mk(RAT.concat(["..oo.oo.oo....","pp............",".............."]),PR),mk(RAT.concat(["...oo.oo.oo...",".pp...........",".............."]),PR)];
const SNAKE=["................","....oooooo......","...oGGGGGGoo....","..oGGgggggGGo...",".oGggggggggggo..",".oGggggoykogggo.","oGgggggoyyogggo.","oGggggggooggggo.","oggggggggggggggo","oggggggggggggggo","oggggggoooooooo.",".oggggggggggo.rr","..oggggggggo.r.r","...oooooooo.....","................","................"];
SPR.snake=[mk(SNAKE,{o:'#132213',g:'#4c9a4a',G:'#86cc72',y:'#ffd23a',k:'#111111',r:'#e2394a'})];
SPR.fly=[mk(["w.....w","ww.o.ww",".woGow.","..ogo..","..ogo..","...o..."],{w:'#ffffff',o:'#1f3a06',g:'#a8ff3c',G:'#f2ffb8'}),mk([".......","w..o..w","wwoGoww","..ogo..","..ogo..","...o..."],{w:'#ffffff',o:'#1f3a06',g:'#a8ff3c',G:'#f2ffb8'})];
SPR.berry=[mk(["...gg..","..gg...",".ooooo.","orRrrro","oRrrrro","orrrrro",".ooooo."],{o:'#4a0e14',r:'#ff4655',R:'#ffc0c0',g:'#7cff6a'})];
SPR.egg=[mk([".ooooo.","oeEEeeo","oeEkkeo","oeekkeo","oeeeeeo","oeeeeeo",".ooooo."],{o:'#0b4a58',e:'#a8f6ff',E:'#ffffff',k:'#0c2a33'}),mk([".ooooo.","oeEEeeo","oeEkkeo","oeekkeo","oeeeeeo","oeeeeeo",".ooooo."],{o:'#5a0b1a',e:'#ffb0bc',E:'#ffffff',k:'#3a0610'})];
function mkGlow(rgb,a,r){const c=document.createElement('canvas');c.width=c.height=r*2;const x=c.getContext('2d'),g=x.createRadialGradient(r,r,0,r,r,r);g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(.45,`rgba(${rgb},.35)`);g.addColorStop(1,`rgba(${rgb},0)`);x.fillStyle=g;x.fillRect(0,0,r*2,r*2);return c}
const GLOW={fly:mkGlow('190,255,80',.95,11),berry:mkGlow('255,80,95',.95,13),egg:mkGlow('80,235,255',.95,15),eggR:mkGlow('255,70,90',.95,15),eb:mkGlow('210,110,255',.9,8),bb:mkGlow('255,110,80',.9,9)};
const ICON={
  tongue:mk(["........","....pppp","...pPPPp","..pPp...","..pp....",".pp.....","pp......","p......."],{p:'#f07aa0',P:'#ffb3cb'}),
  bubble:mk(["..oooo..",".obbbbo.","obwbbbbo","obbbbbbo","obbbbbbo","obbbbbbo",".obbbbo.","..oooo.."],{o:'#3a6f9a',b:'#8fd3ff',w:'#ffffff'}),
  leaf:mk(["...ll...","..lLll..",".lLllll.","lLllllll","llllllll",".llllll.","..llll..","...dd..."],{l:'#5fae55',L:'#9ee08a',d:'#3f6b37'}),
  tadpole:mk(["........","..kkk...",".kkkkk..",".kwkkkk.",".kkkkkkk","..kkk..k","......kk","........"],{k:'#7fd6ff',w:'#ffffff'}),
  mist:mk(["..m..m..",".mmmmmm.","mmMmmmMm","mmmmmmmm",".mmMmmm.","..mmmm..","...mm...","........"],{m:'#9ccf6a',M:'#d4f59a'}),
  dragonfly:mk(["...cc...","wwwccwww",".wwccww.","...cc...","...cc...","...cc...","...cc...","...c...."],{c:'#58d0e8',w:'#d8f6ff'}),
  egg:mk(["..eeee..",".eEEeee.","eEkkeeee","eekkeeee","eeeeekke","eeeeekke",".eeeeee.","..eeee.."],{e:'#e9f2d8',E:'#ffffff',k:'#2a3a2a'}),
};
const URL_={};for(const k in ICON)URL_[k]=ICON[k].toDataURL();
URL_.fly=SPR.fly[0].toDataURL();URL_.frog=SPR.frog[0].toDataURL();
$('#coinIco').src=URL_.fly;

/* ---------- static world ---------- */
const WORLD=document.createElement('canvas');WORLD.width=WS;WORLD.height=WS;
const RIP=[];
(function buildWorld(){const w=WORLD.getContext('2d');
  w.fillStyle='#163650';w.fillRect(0,0,WS,WS);
  for(let i=0;i<1400;i++){w.fillStyle=Math.random()<.5?'#1a3e5b':'#132f47';w.fillRect(rnd(0,WS)|0,rnd(0,WS)|0,rnd(2,6)|0,1)}
  // lily pads in the water ring
  for(let i=0;i<46;i++){let x,y;do{x=rnd(6,WS-6);y=rnd(6,WS-6)}while(x>M-14&&x<M+ARENA+14&&y>M-14&&y<M+ARENA+14);
    const r=rnd(5,10)|0;w.fillStyle='#2f6a3a';w.beginPath();w.arc(x|0,y|0,r,0.5,Math.PI*2);w.lineTo(x|0,y|0);w.fill();
    w.fillStyle='#3f8848';w.fillRect((x-r/2)|0,(y-r/2)|0,2,1);if(Math.random()<.25){w.fillStyle='#f6a6c8';w.fillRect(x|0,(y-2)|0,3,3);w.fillStyle='#fff3';w.fillRect(x|0,(y-2)|0,1,1)}}
  for(let i=0;i<60;i++){let x,y;do{x=rnd(0,WS);y=rnd(0,WS)}while(x>M-6&&x<M+ARENA+6&&y>M-6&&y<M+ARENA+6);RIP.push({x:x-M,y:y-M,p:rnd(0,6)})}
  // grass
  w.fillStyle='#4a3a28';w.fillRect(M-4,M-4,ARENA+8,ARENA+8);
  w.fillStyle='#2e5a37';w.fillRect(M,M,ARENA,ARENA);
  const G2=['#28502f','#356640','#2a5533','#3a6d43'];
  for(let i=0;i<5200;i++){w.fillStyle=pickR(G2);w.fillRect((M+rnd(0,ARENA))|0,(M+rnd(0,ARENA))|0,rnd(1,3)|0,1)}
  for(let i=0;i<260;i++){const x=(M+rnd(4,ARENA-4))|0,y=(M+rnd(4,ARENA-4))|0;w.fillStyle='#4d8a50';w.fillRect(x,y,1,3);w.fillRect(x+2,y+1,1,2);w.fillRect(x-2,y+1,1,2);w.fillStyle='#24452a';w.fillRect(x-2,y+3,5,1)}
  for(let i=0;i<70;i++){const x=(M+rnd(4,ARENA-4))|0,y=(M+rnd(4,ARENA-4))|0;w.fillStyle=pickR(['#f3e6c4','#f6a6c8','#ffd86a','#b9d7ff']);w.fillRect(x,y,2,2);w.fillStyle='#ffffff55';w.fillRect(x,y,1,1)}
  for(let i=0;i<22;i++){const x=(M+rnd(8,ARENA-8))|0,y=(M+rnd(8,ARENA-8))|0,s=rnd(3,6)|0;w.fillStyle='#1d2b22';w.fillRect(x-1,y+1,s+2,s-1);w.fillStyle='#6f7a72';w.fillRect(x,y,s,s-1);w.fillStyle='#98a39a';w.fillRect(x,y,s-2,1)}
  // reeds along the shore
  for(let i=0;i<180;i++){const side=i%4,t=rnd(0,ARENA);let x,y;
    if(side===0){x=M+t;y=M-3}else if(side===1){x=M+t;y=M+ARENA+2}else if(side===2){x=M-3;y=M+t}else{x=M+ARENA+2;y=M+t}
    const h=rnd(4,9)|0;w.fillStyle='#5d8a3e';w.fillRect(x|0,(y-h)|0,1,h);if(Math.random()<.3){w.fillStyle='#6b4423';w.fillRect(x|0,(y-h-2)|0,1,3)}}
})();
let VIG=null;
function resize(){const r=app.getBoundingClientRect();SCALE=Math.max(1,Math.round(Math.min(r.width,r.height)/240));
  VW=Math.ceil(r.width/SCALE);VH=Math.ceil(r.height/SCALE);cv.width=VW;cv.height=VH;cv.style.width=VW*SCALE+'px';cv.style.height=VH*SCALE+'px';
  ctx.imageSmoothingEnabled=false;VIG=document.createElement('canvas');VIG.width=VW;VIG.height=VH;const v=VIG.getContext('2d');
  const g=v.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.35,VW/2,VH/2,Math.max(VW,VH)*.75);g.addColorStop(0,'rgba(10,6,24,0)');g.addColorStop(1,'rgba(10,6,24,.6)');v.fillStyle=g;v.fillRect(0,0,VW,VH)}
addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
let AC=null,muted=false;const lastS={};
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type,vol,slide,delay=0){if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function sfx(k){if(muted||!AC)return;const n=AC.currentTime,gap={hit:.045,pick:.04,shoot:.06,lick:.07,zap:.08,kill:.05}[k]||0;if(gap&&n-(lastS[k]||0)<gap)return;lastS[k]=n;
  switch(k){case'hit':tone(180,.04,'square',.025,-60);break;case'kill':tone(320,.09,'square',.035,-220);break;case'pick':tone(880,.05,'triangle',.03,500);break;
  case'shoot':tone(620,.06,'sine',.035,-320);break;case'lick':tone(260,.07,'triangle',.05,380);break;case'zap':tone(1200,.08,'sawtooth',.02,-900);break;
  case'boom':tone(120,.25,'square',.05,-80);break;case'hurt':tone(160,.22,'sawtooth',.06,-90);break;
  case'lv':[523,659,784,1046].forEach((f,i)=>tone(f,.12,'square',.035,0,i*.07));break;case'buy':tone(700,.07,'square',.035,0);tone(1050,.1,'square',.035,0,.07);break;
  case'wave':[392,523,659].forEach((f,i)=>tone(f,.14,'triangle',.05,0,i*.09));break;case'boss':[196,185,175,147].forEach((f,i)=>tone(f,.3,'sawtooth',.045,0,i*.22));break}}

let G=null;
const xpNeed=lv=>5+lv*3;
function newGame(startW){
  G={state:'play',wave:0,waveT:0,kills:0,time:0,coins:0,xp:0,lv:1,pendLv:0,winT:0,hurtT:0,shake:0,
    P:{x:ARENA/2,y:ARENA/2,r:5,face:1,hp:20,inv:0,walk:0,moving:false},
    S:{maxHp:20,regen:0,armor:0,dmg:0,aspd:0,spd:0,range:0,crit:.05,steal:0,dodge:0,pickup:28},
    W:[{id:startW,lv:1,cd:.5}],E:[],PR:[],EP:[],PK:[],SP:[],FX:[],TX:[],EG:[],BOLT:[],TNG:[],
    spawnT:1,offers:[],offersWave:-1,rerolls:0,boss:null};

function startWave(n){
  Object.assign(G,{wave:n,waveT:n===20?Infinity:20+(n-1)*1.5,E:[],PR:[],EP:[],PK:[],SP:[],FX:[],TX:[],EG:[],BOLT:[],TNG:[],spawnT:.8,boss:null,state:'play'});
  const P=G.P;P.x=ARENA/2;P.y=ARENA/2;P.hp=G.S.maxHp;P.inv=1;
  if(n===5||n===10||n===15)for(let i=0;i<(n===15?2:1);i++){const c=randPoint(120);G.SP.push({x:c.x,y:c.y,t:2.5+i*6,type:'elite'})}
  if(n===20){G.SP.push({x:ARENA/2,y:ARENA/2-150,t:2,type:'boss'});sfx('boss')}else sfx('wave');
  hideScreen();$('#hud').hidden=false;
}
function randPoint(minD){for(let i=0;i<30;i++){const x=rnd(24,ARENA-24),y=rnd(24,ARENA-24);if(Math.hypot(x-G.P.x,y-G.P.y)>minD)return{x,y}}return{x:24,y:24}}
function pickType(w){const pool=[['mosq',1]];if(w>=3)pool.push(['beetle',.5+w*.03]);if(w>=5)pool.push(['rat',.45]);if(w>=7)pool.push(['snail',.35]);
  let r=Math.random()*pool.reduce((a,b)=>a+b[1],0);for(const[t,wt]of pool)if((r-=wt)<=0)return t;return'mosq'}
function mkEnemy(type,x,y){const d=ET[type],w=G.wave,hm=type==='boss'?1:1+(w-1)*.22,dm=1+(w-1)*.07;
  const e={type,x,y,r:d.r,hp:Math.round(d.hp*hm),spd:d.spd*(1+(w-1)*.012),dmg:Math.round(d.dmg*dm),spr:d.spr,sc:d.sc||1,t:rnd(0,5),seed:rnd(0,9),
    flash:0,slow:0,kx:0,ky:0,face:1,st:0,sT:0,cd:rnd(.5,2),cd2:7,cd3:5,dead:false,tad:0};
  e.maxHp=e.hp;if(type==='boss'){e.trail=[];e.segs=[];e.a=Math.PI/2;e.cd=2.5;G.boss=e;$('#bossbar').hidden=false}
  return e}

const joy={on:false,id:null,sx:0,sy:0,vx:0,vy:0},joyEl=$('#joy'),knob=$('#knob');

cv.addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;const r=app.getBoundingClientRect();let dx=e.clientX-r.left-joy.sx,dy=e.clientY-r.top-joy.sy;
  const l=Math.hypot(dx,dy),m=38;if(l>m){dx=dx/l*m;dy=dy/l*m}joy.vx=dx/m;joy.vy=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`});
const joyEnd=e=>{if(e.pointerId!==joy.id)return;joy.on=false;joy.vx=joy.vy=0;joyEl.hidden=true};

function inputVec(){let x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),y=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(joy.on&&(joy.vx||joy.vy)){x=joy.vx;y=joy.vy}const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}return{x,y}}

/* ---------- combat helpers ---------- */
function hitTest(e,x,y,r){if(Math.hypot(e.x-x,e.y-y)<e.r+r)return true;if(e.segs)for(const s of e.segs)if(Math.hypot(s.x-x,s.y-y)<6+r)return true;return false}
function nearest(x,y,R,excl){let b=null,bd=1e9;for(const e of G.E){if(e.dead||(excl&&excl.has(e)))continue;const d=Math.hypot(e.x-x,e.y-y)-e.r;if(d<R&&d<bd){bd=d;b=e}}return b}
function addText(x,y,s,col){if(G.TX.length>90)G.TX.shift();G.TX.push({x:x+rnd(-3,3),y,s,col,life:.6})}
function burst(x,y,col,n,sp=50){for(let i=0;i<n;i++){const a=rnd(0,7),v=rnd(sp*.3,sp);G.FX.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.25,.5),col,s:Math.random()<.5?1:2})}}
function heal(n){const P=G.P;if(P.hp>=G.S.maxHp)return;P.hp=Math.min(G.S.maxHp,P.hp+n);addText(P.x,P.y-12,'+'+n,'#7cff8a')}
function hitEnemy(e,base,dx=0,dy=0,kb=0){if(e.dead)return;const S=G.S,crit=Math.random()<S.crit;const d=Math.max(1,Math.round(base*(1+S.dmg)*(crit?2:1)));
  e.hp-=d;e.flash=.08;if(kb&&e.type!=='boss'&&e.type!=='elite'){const l=Math.hypot(dx,dy)||1;e.kx+=dx/l*kb;e.ky+=dy/l*kb}
  addText(e.x,e.y-8*e.sc,String(d),crit?'#ffd23a':'#ffffff');if(S.steal>0&&Math.random()<S.steal)heal(1);sfx('hit');if(e.hp<=0)killEnemy(e)}
function killEnemy(e){e.dead=true;G.kills++;sfx('kill');
  const col={mosq:'#7a5aa0',beetle:'#b8433a',rat:'#b4aec2',snail:'#b58cf2',elite:'#9a7bf0',boss:'#86cc72'}[e.type];burst(e.x,e.y,col,e.type==='elite'?24:8);
  const n=e.type==='elite'?10:e.type==='boss'?0:1;for(let i=0;i<n;i++)G.PK.push({k:'fly',x:e.x,y:e.y,vx:rnd(-40,40),vy:rnd(-40,40),t:rnd(0,2)});
  if(e.type!=='boss'&&Math.random()<(e.type==='elite'?1:.025))G.PK.push({k:'berry',x:e.x,y:e.y,vx:rnd(-20,20),vy:rnd(-20,20),t:0});
  if(e.type==='boss'){G.winT=2;$('#bossbar').hidden=true;for(const o of G.E)if(!o.dead){o.dead=true;burst(o.x,o.y,'#fff',4)}G.SP=[];G.EP=[];
    for(let i=0;i<5;i++)setTimeout(()=>{if(G)burst(e.x+rnd(-20,20),e.y+rnd(-20,20),pickR(['#86cc72','#ffd23a','#fff']),20,90);sfx('boom')},i*220)}}
function hurt(dmg){const P=G.P,S=G.S;if(P.inv>0||G.winT>0)return;
  if(Math.random()<Math.min(.6,S.dodge)){addText(P.x,P.y-12,'MISS','#8fd3ff');P.inv=.3;return}
  const d=Math.max(1,Math.round(dmg/(1+Math.max(-5,S.armor)*.08)));P.hp-=d;P.inv=.6;G.shake=reduceMotion?0:.18;G.hurtT=.15;addText(P.x,P.y-12,String(d),'#ff5a5a');sfx('hurt');
  if(P.hp<=0){P.hp=0;gameOver(false)}}
function shootE(x,y,ux,uy,sp,dmg,col='#c86bff'){G.EP.push({x,y,vx:ux*sp,vy:uy*sp,dmg,life:4,col})}
function ring(e,n,sp,col){for(let i=0;i<n;i++){const a=i/n*Math.PI*2+e.t;shootE(e.x,e.y,Math.cos(a),Math.sin(a),sp,Math.ceil(e.dmg*.6),col)}}

/* ---------- weapons ---------- */
function updWeapons(dt){const S=G.S,P=G.P,as=Math.max(.3,1+S.aspd);
  for(const w of G.W){const L=w.lv;
    if(w.id==='tadpole'){w.ang=(w.ang||0)+dt*3.2;const n=Math.min(6,1+L),rad=24+S.range*.2;w.pos=[];
      for(let i=0;i<n;i++){const a=w.ang+i/n*Math.PI*2,x=P.x+Math.cos(a)*rad,y=P.y+Math.sin(a)*rad*.85;w.pos.push({x,y,a});
        for(const e of G.E)if(!e.dead&&e.tad<=G.time&&hitTest(e,x,y,3)){e.tad=G.time+.35;hitEnemy(e,4+(L-1)*2.5,e.x-P.x,e.y-P.y,70)}}continue}
    if(w.id==='mist'){w.rad=24+L*4+S.range*.2;w.cd-=dt;if(w.cd<=0){w.cd=.5/as;for(const e of G.E)if(!e.dead&&hitTest(e,P.x,P.y,w.rad)){e.slow=.6;hitEnemy(e,2+(L-1)*1.5)}}continue}
    w.cd-=dt;if(w.cd>0)continue;
    if(w.id==='tongue'){const R=44+S.range*.4,t=nearest(P.x,P.y,R);if(!t){w.cd=.05;continue}w.cd=(.95-L*.06)/as;
      const mx=P.x+P.face*4,my=P.y+1;G.TNG.push({x:t.x,y:t.y,life:.14});
      if(L>=3){const vx=t.x-mx,vy=t.y-my,ll=vx*vx+vy*vy||1;for(const e of G.E){if(e===t||e.dead)continue;const u=clamp(((e.x-mx)*vx+(e.y-my)*vy)/ll,0,1);
        if(Math.hypot(mx+vx*u-e.x,my+vy*u-e.y)<e.r+3)hitEnemy(e,6+(L-1)*4,vx,vy,90)}}
      hitEnemy(t,6+(L-1)*4,t.x-P.x,t.y-P.y,130);sfx('lick')}
    else if(w.id==='bubble'){const R=120+S.range,t=nearest(P.x,P.y,R);if(!t){w.cd=.05;continue}w.cd=(.8-L*.04)/as;
      const n=1+(L>=3)+(L>=5),b=Math.atan2(t.y-P.y,t.x-P.x);
      for(let i=0;i<n;i++){const a=b+(i-(n-1)/2)*.2;G.PR.push({k:'bubble',x:P.x,y:P.y-2,vx:Math.cos(a)*150,vy:Math.sin(a)*150,r:3,dmg:5+(L-1)*2.5,pierce:L>=4?1:0,life:(R+30)/150,hit:new Set()})}sfx('shoot')}
    else if(w.id==='leaf'){const R=110+S.range,t=nearest(P.x,P.y,R);if(!t){w.cd=.05;continue}w.cd=(2.4-L*.15)/as;
      const n=1+(L>=3)+(L>=5),b=Math.atan2(t.y-P.y,t.x-P.x),D=80+S.range*.5;
      for(let i=0;i<n;i++){const a=b+(i-(n-1)/2)*.55;G.PR.push({k:'leaf',x:P.x,y:P.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,r:5,dmg:7+(L-1)*3,t:0,tOut:D/170,ret:false,rot:0,life:12,hit:new Set()})}sfx('shoot')}
    else if(w.id==='dragonfly'){const t=nearest(P.x,P.y,130+S.range);if(!t){w.cd=.05;continue}w.cd=(1.7-L*.1)/as;
      const hit=new Set([t]),pts=[{x:P.x,y:P.y-4},{x:t.x,y:t.y}];let cur=t;
      for(let c=0;c<2+L;c++){const nx=nearest(cur.x,cur.y,55,hit);if(!nx)break;hit.add(nx);pts.push({x:nx.x,y:nx.y});cur=nx}
      for(const e of hit)hitEnemy(e,8+(L-1)*4);G.BOLT.push({pts,life:.16});sfx('zap')}
    else if(w.id==='egg'){w.cd=(2-L*.15)/as;if(G.EG.length<8)G.EG.push({x:P.x,y:P.y+4,arm:.4,life:10,dmg:14+(L-1)*6,rad:26+L*2})}
  }}

/* ---------- update ---------- */
function update(dt){
  const P=G.P,S=G.S;G.time+=dt;
  if(G.winT>0){G.winT-=dt;if(G.winT<=0){gameOver(true);return}}
  // player
  const v=inputVec(),sp=Math.max(20,62*(1+S.spd));P.moving=!!(v.x||v.y);
  P.x=clamp(P.x+v.x*sp*dt,8,ARENA-8);P.y=clamp(P.y+v.y*sp*dt,8,ARENA-8);if(v.x)P.face=v.x>0?1:-1;if(P.moving)P.walk+=dt;
  P.inv-=dt;G.hurtT-=dt;if(S.regen>0)P.hp=Math.min(S.maxHp,P.hp+S.regen*.12*dt);
  // spawning
  if(G.winT<=0){G.spawnT-=dt;if(G.spawnT<=0){const w=G.wave,boss=w===20;G.spawnT=boss?1.8:Math.max(.4,1.5-w*.055);
    const cap=boss?45:55+w*4;if(G.E.length+G.SP.length<cap){const n=boss?2:1+Math.floor(w/4)+(Math.random()<.5?1:0),c=randPoint(90);
      for(let i=0;i<n;i++)G.SP.push({x:clamp(c.x+rnd(-18,18),12,ARENA-12),y:clamp(c.y+rnd(-18,18),12,ARENA-12),t:.8,type:pickType(boss?7:w)})}}}
  for(const s of G.SP){s.t-=dt;if(s.t<=0){s.done=true;G.E.push(mkEnemy(s.type,s.x,s.y))}}G.SP=G.SP.filter(s=>!s.done);
  updWeapons(dt);
  // enemies
  for(const e of G.E){if(e.dead)continue;e.t+=dt;e.flash-=dt;e.slow-=dt;
    const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;let s=e.spd*(e.slow>0?.6:1),mx=ux,my=uy;
    if(e.type==='mosq'){const wv=Math.sin(e.t*6+e.seed)*.45;mx=ux-uy*wv;my=uy+ux*wv}
    else if(e.type==='rat'){if(e.st===0){e.cd-=dt;if(d<85&&e.cd<=0){e.st=1;e.sT=.5}}else if(e.st===1){mx=my=0;e.sT-=dt;if(e.sT<=0){e.st=2;e.sT=.38;e.dx=ux;e.dy=uy}}
      else{mx=e.dx;my=e.dy;s=170;e.sT-=dt;if(e.sT<=0){e.st=0;e.cd=1.8}}}
    else if(e.type==='snail'){if(d<70){mx=-ux;my=-uy}else if(d<105){mx=my=0}e.cd-=dt;if(e.cd<=0&&d<170){e.cd=2.6;shootE(e.x,e.y-3,ux,uy,72,e.dmg)}}

    if(Math.abs(mx)>.05)e.face=mx>0?1:-1;
    if(e.type==='boss'){const tr=e.trail,l=tr[0];if(!l||Math.hypot(l.x-e.x,l.y-e.y)>2){tr.unshift({x:e.x,y:e.y});if(tr.length>80)tr.pop()}e.segs=[];for(let i=1;i<=12;i++){const p=tr[i*4];if(p)e.segs.push(p)}}
    if(hitTest(e,P.x,P.y,P.r-1))hurt(e.dmg)}

    const dx=b.x-a.x,dy=b.y-a.y,rr=(a.r+b.r)*.85;if(Math.abs(dx)>rr||Math.abs(dy)>rr)continue;const d=Math.hypot(dx,dy)||.01;if(d<rr){const p=(rr-d)/2/d;a.x-=dx*p;a.y-=dy*p;b.x+=dx*p;b.y+=dy*p}}}

      else{const dx=P.x-p.x,dy=P.y-p.y,d=Math.hypot(dx,dy);if(d<8){p.dead=true;continue}p.x+=dx/d*210*dt;p.y+=dy/d*210*dt}}
    else{p.x+=p.vx*dt;p.y+=p.vy*dt}

      if(p.k==='bubble'){if(p.pierce--<=0){p.dead=true;burst(p.x,p.y,'#bfe8ff',4,30);break}}}}

function bossAI(e,dt,ux,uy){e.cd-=dt;e.cd2-=dt;e.cd3-=dt;
  if(e.st===1){e.sT-=dt;e.mx=e.my=0;if(e.sT<=0){e.st=2;e.sT=.9;e.a=Math.atan2(uy,ux)}}
  else if(e.st===2){e.mx=Math.cos(e.a)*3.8;e.my=Math.sin(e.a)*3.8;e.sT-=dt;if(e.sT<=0)e.st=0}
  else{const ta=Math.atan2(uy,ux)+Math.sin(e.t*2.2)*.7;let da=((ta-e.a)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI;e.a+=clamp(da,-2.6*dt,2.6*dt);
    e.mx=Math.cos(e.a);e.my=Math.sin(e.a);
    if(e.cd<=0){e.cd=e.enr?2.4:3.2;const b=Math.atan2(uy,ux);for(let i=-2;i<=2;i++)shootE(e.x,e.y,Math.cos(b+i*.22),Math.sin(b+i*.22),85,Math.ceil(e.dmg*.6),'#ff6b5b')}
    if(e.cd2<=0){e.cd2=7.5;e.st=1;e.sT=.8}
    if(e.cd3<=0){e.cd3=7;for(let i=0;i<4;i++){const a=rnd(0,7);G.SP.push({x:clamp(e.x+Math.cos(a)*40,12,ARENA-12),y:clamp(e.y+Math.sin(a)*40,12,ARENA-12),t:.8,type:'mosq'})}}
    if(!e.enr&&e.hp<e.maxHp*.5){e.enr=true;ring(e,16,70,'#ff6b5b')}}}
function gainXp(n){G.xp+=n;while(G.xp>=xpNeed(G.lv)){G.xp-=xpNeed(G.lv);G.lv++;G.pendLv++;addText(G.P.x,G.P.y-18,'LEVEL UP','#7cff8a');burst(G.P.x,G.P.y,'#7cff8a',12,60);sfx('lv')}}
function endWave(){const n=G.PK.filter(k=>k.k==='fly').length;if(n){G.coins+=n;gainXp(n)}joyEnd({pointerId:joy.id});
  try{const b=+localStorage.getItem('naiwa_best')||0;if(G.wave>b)localStorage.setItem('naiwa_best',G.wave)}catch(e){}

  for(let c=0;c<s.length;c++){const m=DIG[s[c]];if(!m)continue;for(let b=0;b<15;b++)if(m[b]==='1')ctx.fillRect(x+c*4+(b%3)+o,y+((b/3)|0)+o,1,1)}}}

function drawSpr(img,x,y,flip,sc=1,white=false){const w=img.width*sc,h=img.height*sc,src=white?WH.get(img):img,X=sx(x),Y=Math.round(sy(y)-h/2);

function glow(img,x,y,a){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=clamp(a,0,1);ctx.drawImage(img,Math.round(sx(x)-img.width/2),Math.round(sy(y)-img.height/2));ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}

        ctx.fillStyle=e.flash>0?'#ffffff':(i%2?'#3f8240':'#4c9a4a');ctx.beginPath();ctx.arc(sx(s.x),sy(s.y),r,0,7);ctx.fill();ctx.fillStyle='#86cc72';ctx.fillRect(sx(s.x)-1,sy(s.y)-r+1,2,2)}

    ${best?`<p class="sub">最佳紀錄：撐到第 ${best} 波</p>`:''}
  </div>`)}
function showLevelUp(){G.state='levelup';const opts=[...LVUP].sort(()=>Math.random()-.5).slice(0,4);G._lv=opts;
  showScreen(`<div class="panel center"><h2>升級了！Lv ${G.lv-G.pendLv+1}</h2><p class="sub">選一項強化${G.pendLv>1?`（還有 ${G.pendLv-1} 次）`:''}</p>
    <div class="grid" style="width:100%">${opts.map((o,i)=>`<button class="card" data-lv="${i}"><div class="nm">${o.n}</div><div class="ds">${o.d}</div></button>`).join('')}</div></div>`)}
function genOffers(){const w=G.wave,m=1+.1*(w-1),out=[];
  for(let i=0;i<4;i++){let o=null;const canNew=G.W.length<6,ups=G.W.filter(x=>x.lv<5);
    if(Math.random()<.42&&(canNew||ups.length)){const ids=Object.keys(WPN).filter(id=>{const h=G.W.find(x=>x.id===id);return h?h.lv<5:canNew});
      const id=pickR(ids),h=G.W.find(x=>x.id===id);if(!out.some(q=>q.wid===id))o=h?{t:'up',wid:id,price:Math.round((WPN[id].p*.8+h.lv*5)*m)}:{t:'w',wid:id,price:Math.round(WPN[id].p*m)}}
    if(!o){let it;do{it=pickR(ITEMS)}while(out.some(q=>q.it===it));o={t:'i',it,price:Math.round(it.p*m)}}
    out.push(o)}G.offers=out;G.offersWave=w}
function showShop(){G.state='shop';if(G.offersWave!==G.wave){G.rerolls=0;genOffers()}const rc=1+Math.floor(G.wave/3)+G.rerolls;
  const cards=G.offers.map((o,i)=>{let ico,nm,tag,ds;
    if(o.t==='i'){ico=`<div class="ico" style="color:${o.it.c}">${o.it.n[0]}</div>`;nm=o.it.n;tag='<span class="tag">道具</span>';ds=o.it.d}
    else{const h=G.W.find(x=>x.id===o.wid),L=o.t==='up'?h.lv+1:1;ico=`<div class="ico"><img class="pix" src="${URL_[o.wid]}" alt=""></div>`;nm=WPN[o.wid].n+(o.t==='up'?` Lv${L}`:'');
      tag=o.t==='up'?'<span class="tag u">武器升級</span>':'<span class="tag w">新武器</span>';ds=WPN[o.wid].d(L)}
    const stale=o.t==='up'&&G.W.find(x=>x.id===o.wid).lv>=5,full=o.t==='w'&&(G.W.length>=6||G.W.some(x=>x.id===o.wid));
    const dis=o.sold||stale||full,poor=G.coins<o.price;
    return `<button class="card" data-buy="${i}" ${dis?'disabled':''}><div class="top">${ico}<div class="nm">${nm}</div></div>${tag}<div class="ds">${ds}</div>
      <div class="price ${poor&&!dis?'no':''}">${o.sold?'已購買':full?'武器欄已滿':`${coin}${o.price}`}</div></button>`}).join('');
  showScreen(`<div class="panel">
    <div class="bar-row"><div><h2>第 ${G.wave} 波完成</h2><p class="sub">剩 ${20-G.wave} 波${G.wave===19?'，下一波是蛇王':''}</p></div><div class="price big-n">${coin}${G.coins}</div></div>
    <div class="shop-wrap">
      <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
        <div class="grid">${cards}</div>
        <div class="bar-row"><button class="btn ghost" id="reroll" ${G.coins<rc?'disabled':''}>重新進貨 · ${rc}</button><button class="btn" id="next">開始第 ${G.wave+1} 波</button></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
        <div class="box"><h3>武器 ${G.W.length}/6</h3>${slotsHTML()}</div>
        <div class="box"><h3>能力</h3>${statsHTML()}</div>
      </div>
    </div></div>`)}
function showPause(){if(!G||G.state!=='play')return;G.state='pause';joyEnd({pointerId:joy.id});
  showScreen(`<div class="panel center" style="max-width:420px"><h2>暫停</h2><div class="box" style="width:100%;text-align:left"><h3>武器</h3>${slotsHTML()}<h3>能力</h3>${statsHTML()}</div>
    <div class="bar-row" style="width:100%"><button class="btn ghost" id="quit">回到標題</button><button class="btn" id="resume">繼續</button></div></div>`)}
function resume(){if(G&&G.state==='pause'){G.state='play';hideScreen();last=performance.now()}}
function gameOver(win){G.state='over';$('#bossbar').hidden=true;joyEnd({pointerId:joy.id});const cleared=win?20:G.wave-1;
  try{const b=+localStorage.getItem('naiwa_best')||0;if(cleared>b)localStorage.setItem('naiwa_best',cleared)}catch(e){}
  const m=Math.floor(G.time/60),s=String(Math.floor(G.time%60)).padStart(2,'0');
  setTimeout(()=>showScreen(`<div class="panel center" style="max-width:520px"><img class="pix hero" src="${URL_.frog}" alt="" style="${win?'':'transform:rotate(90deg);filter:grayscale(.6)'}">
    <h2>${win?'池塘守住了！':'奶蛙倒下了'}</h2><p class="sub">${win?'蛇王被打倒，20 波全數撐過。':`在第 ${G.wave} 波被蟲群淹沒。`}</p>
    <div class="result"><div class="box"><h3>波數</h3><span class="big-n">${cleared}/20</span></div><div class="box"><h3>擊殺</h3><span class="big-n">${G.kills}</span></div><div class="box"><h3>時間</h3><span class="big-n">${m}:${s}</span></div></div>
    <div class="box" style="width:100%;text-align:left"><h3>最終配置 · Lv ${G.lv}</h3>${slotsHTML()}</div>
    <button class="btn" id="again">再玩一次</button></div>`),win?200:700)}

scr.addEventListener('click',e=>{ac();const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.start){newGame(b.dataset.start);return}
  if(b.dataset.lv!=null){G._lv[+b.dataset.lv].f(G.S);G.pendLv--;sfx('buy');if(G.pendLv>0)showLevelUp();else showShop();return}
  if(b.dataset.buy!=null){const o=G.offers[+b.dataset.buy];if(G.coins<o.price){sfx('hurt');return}G.coins-=o.price;o.sold=true;sfx('buy');
    if(o.t==='i')o.it.f(G.S);else if(o.t==='up')G.W.find(x=>x.id===o.wid).lv++;else G.W.push({id:o.wid,lv:1,cd:.3});showShop();return}
  if(b.id==='reroll'){const rc=1+Math.floor(G.wave/3)+G.rerolls;if(G.coins<rc)return;G.coins-=rc;G.rerolls++;genOffers();G.offersWave=G.wave;sfx('buy');showShop();return}
  if(b.id==='next'){startWave(G.wave+1);last=performance.now();return}
  if(b.id==='resume'){resume();return}
  if(b.id==='quit'||b.id==='again'){showTitle();return}});
$('#pauseBtn').addEventListener('click',()=>{ac();if(G&&G.state==='play')showPause();else if(G&&G.state==='pause')resume()});
$('#muteBtn').addEventListener('click',()=>{ac();muted=!muted;$('#muteBtn').textContent=muted?'×':'♪'});

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(G&&G.state==='play')update(dt);draw();hud();requestAnimationFrame(frame)}
showTitle();requestAnimationFrame(frame);
</script>
</body>
